<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pal the pug — playground</title>
<style>
  :root { --bg: #f7f2ea; --ink: #3a2820; --muted: #7b6a60; --card: #fffaf2; --line: #e6dccd; --accent: #0b7a6b; }
  body.dark { --bg: #14181c; --ink: #e9e2d8; --muted: #9aa3ab; --card: #1b2026; --line: #2b333b; --accent: #45d3bc; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 12px; font-size: 20px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  button { font: inherit; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  #stage { width: 320px; height: 320px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
  body.record { padding: 0; }
  body.record h1, body.record .bar, body.record p { display: none; }
  body.record, body.record #stage { background: transparent; }
  body.record #stage { width: 320px; height: 320px; border: 0; border-radius: 0; }
  p { color: var(--muted); }
</style>
<script src="../../media/vendor/gsap.min.js"></script>
<script src="../../media/vendor/MorphSVGPlugin.min.js"></script>
<script src="../../media/mascot.js"></script>
</head>
<body>
<h1>Pal — playground</h1>
<div class="bar" id="poses"></div>
<div class="bar">
  <button id="theme">Dark mode</button>
  <button id="slow">Speed 0.25×</button>
</div>
<div id="stage"></div>
<p>Click Pal for the easter egg. Idle life (blinks, ear twitches, glances, little smiles) is random.</p>
<script>
(function () {
  var M = window.PushPalMascot;
  var stage = document.getElementById('stage');
  var current = 'sit';
  function fresh(pose) {
    stage.innerHTML = M.svg({ pose: pose, size: location.hash === '#record' ? 290 : 260 });
    return stage.firstChild;
  }
  var svg = fresh('sit');
  var bar = document.getElementById('poses');
  M.poses.forEach(function (p) {
    var b = document.createElement('button');
    b.textContent = p;
    b.onclick = function () {
      current = p;
      M.setPose(svg, p);
      bar.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    };
    bar.appendChild(b);
  });
  document.getElementById('theme').onclick = function () { this.classList.toggle('on', document.body.classList.toggle('dark')); };
  document.getElementById('slow').onclick = function () {
    var slow = this.classList.toggle('on');
    gsap.globalTimeline.timeScale(slow ? 0.25 : 1);
  };

  // Frame-exact recording (scripts/mascot-render.mjs gifs): drive GSAP's clock by hand.
  if (location.hash === '#record') {
    document.body.classList.add('record');
    gsap.ticker.remove(gsap.updateRoot);
    var t0 = gsap.ticker.time;
    var clock = 0;
    var FROM = { sleep: 'sit', check: 'sleep', alert: 'sleep', merge: 'alert', success: 'merge', conflict: 'merge', fail: 'sit', pass: 'sit', welcome: null, love: 'sit', sit: null };
    var LENGTH = { sit: 9, sleep: 4.5, check: 5, alert: 3.2, merge: 3.4, success: 2.8, conflict: 3.2, fail: 3.6, pass: 2.6, welcome: 2.6, love: 2.4 };
    window.__record = {
      poses: M.poses,
      start: function (pose) {
        var from = FROM[pose];
        svg = fresh(from || pose);
        if (pose === 'welcome') svg.classList.add('enter');
        clock += 5; // let the previous pose finish settling off-camera
        gsap.updateRoot(t0 + clock);
        if (from) {
          clock += 1.2;
          gsap.updateRoot(t0 + clock);
          M.setPose(svg, pose);
        } else if (pose === 'welcome') {
          M.setPose(svg, 'sit');
          M.setPose(svg, 'welcome');
        }
        window.__record.base = clock;
        return { seconds: LENGTH[pose] || 3, from: from };
      },
      seek: function (t) { gsap.updateRoot(t0 + window.__record.base + t); }
    };
  }
})();
</script>
</body>
</html>
